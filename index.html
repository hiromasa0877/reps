<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#fbfbfd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reps" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Reps</title>
  </head>
  <body>
    <div class="backdrop"><i></i><i></i><i></i></div>
    <!-- Full-screen skeleton painted before JS loads; React replaces it on mount. -->
    <div id="root">
      <div class="app" aria-busy="true">
        <div class="topbar glass">
          <div class="topbar-row">
            <div class="grow">
              <div class="sk" style="width: 120px; height: 26px"></div>
              <div class="sk" style="width: 84px; height: 13px; margin-top: 8px"></div>
            </div>
            <div class="sk" style="width: 58px; height: 58px; border-radius: 50%"></div>
          </div>
          <div class="dates">
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
            <div class="sk" style="height: 54px; border-radius: 16px"></div>
          </div>
        </div>
        <div class="list">
          <div class="sk" style="width: 64px; height: 14px; margin: 10px 6px 0"></div>
          <div class="glass sk-card"><div class="sk-lines"><div class="sk" style="width: 55%; height: 16px"></div><div class="sk" style="width: 35%; height: 12px"></div><div class="sk" style="width: 70%; height: 22px"></div></div><div class="sk" style="width: 34px; height: 34px; border-radius: 50%"></div></div>
          <div class="glass sk-card"><div class="sk-lines"><div class="sk" style="width: 48%; height: 16px"></div><div class="sk" style="width: 30%; height: 12px"></div><div class="sk" style="width: 60%; height: 22px"></div></div><div class="sk" style="width: 34px; height: 34px; border-radius: 50%"></div></div>
          <div class="glass sk-card"><div class="sk-lines"><div class="sk" style="width: 60%; height: 16px"></div><div class="sk" style="width: 38%; height: 12px"></div><div class="sk" style="width: 50%; height: 22px"></div></div><div class="sk" style="width: 34px; height: 34px; border-radius: 50%"></div></div>
          <div class="glass sk-card"><div class="sk-lines"><div class="sk" style="width: 42%; height: 16px"></div><div class="sk" style="width: 28%; height: 12px"></div><div class="sk" style="width: 66%; height: 22px"></div></div><div class="sk" style="width: 34px; height: 34px; border-radius: 50%"></div></div>
        </div>
      </div>
      <div class="tabbar">
        <div class="tabs glass"><div class="sk" style="width: 220px; height: 52px; border-radius: 99px"></div></div>
        <div class="sk" style="width: 64px; height: 64px; border-radius: 50%"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
